name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# No deployment, no secrets, no production access. This is a quality gate only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The end-to-end suite starts two servers, runs a browser against them and
    # waits on real HTTP. The default 360 is generous; this bounds a hang.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vuarau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # An empty database, created fresh for this job. Migrations therefore run
      # from scratch on every build, which is the only way "the migrations apply
      # to an empty database" stays true.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vuarau_test
      # The release gate refuses to run production-shape data against the
      # functional test database.
      RELEASE_PERF_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vuarau_perf

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The canonical gate owns migration, performance, tests, builds, browser
      # E2E and both repository-owned rehearsals. Create its separate database
      # before invoking the gate and remove it even when a later step fails.
      - name: Create production-scale rehearsal database
        run: createdb --host=localhost --port=5432 --username=postgres vuarau_perf
        env:
          PGPASSWORD: postgres

      - name: Install Playwright browsers
        run: pnpm --filter @vuarau/web exec playwright install --with-deps chromium

      # --- one canonical release gate ------------------------------------------
      # The executable order is owned by scripts/verify-release.ts. Do not
      # maintain a second ordered release list in this workflow.
      - name: Canonical release gate
        run: pnpm verify:release

      # Coverage is an additional changed-code quality report; it is not a
      # replacement for the canonical release gate.
      - name: Changed-code coverage report
        run: pnpm coverage:changed
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Drop production-scale rehearsal database
        if: always()
        run: dropdb --if-exists --host=localhost --port=5432 --username=postgres vuarau_perf
        env:
          PGPASSWORD: postgres

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload production UI performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-vitals-p75
          path: apps/web/test-results/**/web-vitals-p75.json
          retention-days: 14
          if-no-files-found: ignore
