name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# No deployment, no secrets, no production access. This is a quality gate only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vuarau_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Provided so the `db` project actually runs here. Locally it is optional
      # and those suites skip — see docs/08-qa/test-strategy.md.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vuarau_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Architectural boundaries
        run: pnpm boundary:check

      - name: Documentation
        run: pnpm docs:check

      - name: Traceability
        run: pnpm trace:check

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Domain tests
        run: pnpm test:domain

      - name: Application tests
        run: pnpm test:application

      - name: Contract tests
        run: pnpm test:contract

      - name: Database tests
        run: pnpm test:db
