    title: Order procedures return DTOs matching the published schema
    file: apps/api/src/infrastructure/trpc/router.contract.test.ts
  TC-PAYMENT-012:
    title: Payment procedures return DTOs matching the published schema
    file: apps/api/src/infrastructure/trpc/router.contract.test.ts
  TC-DEBT-008:
    title: Debt procedures return DTOs matching the published schema
    file: apps/api/src/infrastructure/trpc/router.contract.test.ts
  TC-COMMAND-007:
    title: Malformed input returns INVALID_COMMAND_PAYLOAD, not a schema dump
    file: apps/api/src/infrastructure/trpc/router.contract.test.ts

