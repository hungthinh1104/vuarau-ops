    tests: [TC-ORDER-007]
    implementation: [packages/domain-kernel/src/order/order-lines.ts]

  BR-ORDER-004:
    title: Line total rounding is half-up on the minor unit
    risk: P0
    doc: docs/04-business-rules/order-rules.md
