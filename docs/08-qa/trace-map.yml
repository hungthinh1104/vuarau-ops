  # --- end to end, against a real API and a real database ---------------------
  # These are the ones that settle H1 (docs/00-product/validation-plan.md). They
  # are listed here as tests without a rule for the same reason the TC-WEB-*
  # entries are: they assert that a *screen* renders a rule the server already
  # owns. TC-E2E-006 is the exception worth naming — it found a real duplicate
  # payment, which is a defect in the client, not a mis-rendering of one.
  #
  # `trace-check` does not scan `.spec.ts`, so these are declared rather than
  # discovered. Playwright specs are not Vitest tests and do not run in the same
  # command; conflating them would let a skipped E2E suite look like a passing
  # unit suite.
