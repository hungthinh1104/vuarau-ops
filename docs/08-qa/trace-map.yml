    tests: [TC-ORDER-006]
    implementation: [packages/domain-kernel/src/order/confirm-order.ts]

  BR-ORDER-003:
    title: Every line must have a valid product, quantity, unit and price
    risk: P1
    doc: docs/04-business-rules/order-rules.md
