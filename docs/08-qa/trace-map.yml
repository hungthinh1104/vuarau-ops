# Machine-readable traceability index.
#
# Verified by `scripts/trace-check.ts` on every `pnpm verify`:
#   use case → business rule → case → test → implementation
#
# See docs/08-qa/traceability.md for the rules this file must satisfy.
# IDs are never reused. A retired artefact is marked deprecated, not deleted;
# the full old → new mapping lives in docs/02-use-cases/use-case-catalog.md.
#
# `status: planned` means specified, agreed, and deliberately not yet built. Such
# a rule owes a document and a `planned_tests` list, not a passing test, and
# trace-check reports how many exist so the gap is counted rather than remembered.

