# The transition catalog uses business command names while the router uses
# namespace.procedure. Every catalog row must resolve through this alias map.
catalog_aliases:
  CreateCustomer: customer.create
  UpdateCustomer: customer.update
  DeactivateCustomer: customer.deactivate
  ReactivateCustomer: customer.reactivate
  CreateProduct: product.create
  UpdateProduct: product.update
  DeactivateProduct: product.deactivate
  ReactivateProduct: product.reactivate
  CreateSupplier: supplier.create
  UpdateSupplier: supplier.update
  DeactivateSupplier: supplier.deactivate
  ReactivateSupplier: supplier.reactivate
  CreateSaleDraft: sale.createDraft
  UpdateSaleDraft: sale.updateDraft
  PostSale: sale.post
  DiscardSaleDraft: sale.discardDraft
  RecordCustomerPayment: payment.record
  ReverseCustomerPayment: payment.reverse
  PreserveCustomerPaymentAsCredit: payment.preserveCustomerCredit
  RecordSupplierPayment: supplier.recordPayment
  ReverseSupplierPayment: supplier.reversePayment
  CreatePurchaseDraft: purchase.createDraft
  UpdatePurchaseDraft: purchase.updateDraft
  ConfirmPurchase: purchase.confirm
  DiscardPurchaseDraft: purchase.discardDraft
  CreateDeliveryDraft: delivery.createDraft
  UpdateDeliveryDraft: delivery.updateDraft
  CancelDeliveryDraft: delivery.cancelDraft
  DispatchDelivery: delivery.dispatch
  MarkDeliveryDelivered: delivery.markDelivered
  AddWorkspaceMember: session.addMember
  ChangeWorkspaceMemberRole: session.changeMemberRole
  RevokeWorkspaceMembership: session.revokeMembership
  ReactivateWorkspaceMembership: session.reactivateMember
  CreateDocumentShare: document.share
  RevokeDocumentShare: document.revokeShare
  VoidSale: sale.void
  AdjustCustomerDebt: debt.adjust
  VoidPurchase: purchase.void
  AdjustSupplierAccount: supplier.adjustAccount
  RecordPurchaseReceipt: receiving.record
  ReversePurchaseReceipt: receiving.reverse
  AdjustInventory: inventory.adjust
  ReclassifyInventory: inventory.reclassify
  RecordDeliveryReturn: delivery.recordReturn
  GenerateDocument: document.generate
  RebuildAccountProjection: account.rebuildProjection
  RebuildSupplierAccountProjection: supplier.rebuildAccount
  RebuildInventoryProjection: inventory.rebuild
  ExportWorkspaceBackup: operations.exportBackup
  RestoreWorkspaceBackup: operations.restoreBackup
